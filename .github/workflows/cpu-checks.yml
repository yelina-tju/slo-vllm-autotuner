name: CPU checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            environment/release-cpu-constraints.txt
      - name: Install CPU environment
        run: python -m pip install -c environment/release-cpu-constraints.txt .
      - name: Check dependencies and publication scope
        run: |
          python -m pip check
          python scripts/check_publication.py
      - name: V1 tests and control contracts
        run: |
          python -m unittest discover -s tests -q
          python scripts/check_7b_fault_contract.py
      - name: Extension tests and synthetic replay
        run: |
          python -m unittest discover -s extensions/online_admission -p 'test_*.py' -q
          python extensions/online_admission/replay.py
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script" || exit 1; done
