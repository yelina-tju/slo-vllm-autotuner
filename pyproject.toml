[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slo-vllm-autotuner"
version = "0.1.0"
description = "SLO-aware configuration selection for vLLM serving"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
